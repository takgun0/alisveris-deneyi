# Yerel Supabase ayarları (Supabase CLI).
# Burada yazmayan ayarlar CLI'nin varsayılanlarını kullanır.
# Belge: https://supabase.com/docs/guides/local-development/cli/config

project_id = "sepete-ekle-deneyi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Veri API'si tek istekte en çok bu kadar satır döndürür; panel sayfa sayfa okur.
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# Yerel statik sunucu adresi (README: "Yerel çalıştırma").
site_url = "http://127.0.0.1:8080"
additional_redirect_urls = ["http://127.0.0.1:8080/admin/"]
# Yeni kayıt kapalı: yönetici hesapları panodan elle açılır.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
enable_confirmations = false
